<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STECON · Engineer Site Directory</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* STECON brand */
    --brand-blue:#2d4199;
    --brand-blue-2:#4257c4;
    --brand-blue-dark:#1e2d6e;
    --brand-red:#ec1c24;

    --primary:#2d4199;
    --primary-2:#4257c4;
    --primary-soft:rgba(45,65,153,.08);
    --primary-soft-2:rgba(45,65,153,.14);

    --surface:#ffffff;
    --surface-2:#f7f9fc;
    --surface-3:#eef2f9;
    --border:#e4e9f2;
    --border-2:#d7dfec;

    --ink:#0e1729;
    --ink-2:#475069;
    --ink-3:#8a93a8;

    --ok:#0f9d76;
    --warn:#e0a012;

    --r-sm:8px;
    --r:12px;
    --r-lg:18px;
    --shadow-1:0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.06);
    --shadow-2:0 6px 16px rgba(16,24,40,.08), 0 18px 42px rgba(45,65,153,.10);
    --shadow-pop:0 10px 30px rgba(45,65,153,.18);
    --ease:cubic-bezier(.22,.9,.32,1);
    --spring:cubic-bezier(.34,1.4,.5,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Prompt','Noto Sans Thai','Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 560px at 8% -12%, #dbe3fb 0%, transparent 62%),
      radial-gradient(900px 520px at 104% -6%, #e2ecfb 0%, transparent 58%),
      radial-gradient(700px 500px at 60% 110%, #eaf0fb 0%, transparent 60%),
      #f2f5fb;
    display:flex; flex-direction:column;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- animations ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes riseSm{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes ring{0%{transform:scale(.7);opacity:.45}70%{transform:scale(1.9);opacity:0}100%{opacity:0}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes sheen{0%{background-position:-320px 0}100%{background-position:320px 0}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:900;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:14px 26px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(16px) saturate(1.3);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);
    border-bottom:1px solid var(--border);
    animation:rise .5s var(--ease) both;
  }
  .brand{display:flex; align-items:center; gap:13px; min-width:0;}
  .brand-mark{
    height:44px; border-radius:9px; overflow:hidden; flex-shrink:0;
    box-shadow:0 4px 14px rgba(45,65,153,.22);
    transition:transform .3s var(--spring);
  }
  .brand-mark:hover{transform:translateY(-2px) scale(1.03);}
  .brand-mark img{height:100%; width:auto; display:block;}
  .brand-txt h1{
    margin:0; font-size:17px; font-weight:600; letter-spacing:.1px; line-height:1.25;
  }
  .brand-txt p{margin:1px 0 0; font-size:11.5px; color:var(--ink-3); font-weight:400;}

  .head-spacer{flex:1;}

  .searchbox{
    position:relative; width:min(360px,42vw);
  }
  .searchbox svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; color:var(--ink-3); pointer-events:none;
  }
  .searchbox input{
    width:100%; height:40px; border-radius:999px;
    border:1px solid var(--border-2); background:var(--surface);
    padding:0 74px 0 36px;
    font-family:inherit; font-size:13px; color:var(--ink);
    transition:.2s var(--ease);
  }
  .searchbox input::placeholder{color:var(--ink-3);}
  .searchbox input:focus{
    outline:none; border-color:var(--primary-2);
    box-shadow:0 0 0 4px var(--primary-soft);
  }
  .searchbox kbd{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    font-family:inherit; font-size:10px; color:var(--ink-3);
    border:1px solid var(--border-2); border-bottom-width:2px;
    border-radius:5px; padding:2px 6px; background:var(--surface-2);
    pointer-events:none;
  }
  .searchbox.has-val kbd{display:none;}
  .search-clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;
    background:var(--surface-3); color:var(--ink-2);
    display:none; align-items:center; justify-content:center; font-size:14px;
    transition:.15s;
  }
  .searchbox.has-val .search-clear{display:flex;}
  .search-clear:hover{background:var(--primary); color:#fff;}

  .head-stat{
    display:flex; align-items:center; gap:9px;
    padding:7px 14px 7px 11px; border-radius:999px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff; box-shadow:0 4px 14px rgba(45,65,153,.28);
  }
  .head-stat .hs-num{font-size:16px; font-weight:700; line-height:1;}
  .head-stat .hs-lbl{font-size:10.5px; opacity:.85; line-height:1.1;}
  .head-stat svg{width:17px;height:17px;opacity:.9;}

  /* ---------- layout ---------- */
  main{
    flex:1; min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1.32fr) minmax(390px,.88fr);
    gap:20px; padding:20px 26px 26px;
  }
  @media (max-width:1080px){
    main{grid-template-columns:1fr; }
    .map-card{min-height:460px;}
    .panel{min-height:620px;}
  }
  @media (max-width:640px){
    header{padding:12px 16px; gap:12px;}
    main{padding:14px 14px 18px; gap:14px;}
    .searchbox{width:100%; order:3;}
    .head-stat{display:none;}
    .brand-mark{height:38px;}
    .brand-txt h1{font-size:13.5px; line-height:1.2;}
    .brand-txt p{font-size:10.5px;}
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-1);
  }

  /* ---------- map ---------- */
  .map-card{
    display:flex; flex-direction:column; padding:16px;
    min-height:660px;
    animation:rise .55s .05s var(--ease) both;
  }
  .map-head{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
  .map-head h2{
    margin:0; font-size:12px; font-weight:600; letter-spacing:.55px;
    text-transform:uppercase; color:var(--ink-3);
  }
  .map-head .mh-sep{flex:1;}
  .chip-btn{
    display:inline-flex; align-items:center; gap:6px;
    height:30px; padding:0 12px; border-radius:999px;
    border:1px solid var(--border-2); background:var(--surface);
    font-family:inherit; font-size:11.5px; font-weight:500; color:var(--ink-2);
    cursor:pointer; transition:.18s var(--ease); white-space:nowrap;
  }
  .chip-btn svg{width:13px;height:13px;}
  .chip-btn:hover{border-color:var(--primary-2); color:var(--primary); box-shadow:0 3px 10px rgba(45,65,153,.12);}
  .chip-btn.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .chip-btn:active{transform:scale(.96);}

  .map-wrap{
    flex:1; position:relative; border-radius:var(--r);
    overflow:hidden; border:1px solid var(--border);
    background:#e8eef7;
  }
  #leaflet-map{position:absolute; inset:0;}

  .leaflet-control-zoom{border:none !important; box-shadow:var(--shadow-1) !important; border-radius:10px !important; overflow:hidden;}
  .leaflet-control-zoom a{
    background:var(--surface) !important; color:var(--primary) !important;
    border-color:var(--border) !important; font-weight:600;
    transition:.15s;
  }
  .leaflet-control-zoom a:hover{background:var(--primary) !important; color:#fff !important;}
  .leaflet-control-attribution{
    background:rgba(255,255,255,.86) !important; color:var(--ink-3) !important;
    font-size:9.5px !important; font-family:inherit !important;
  }
  .leaflet-control-attribution a{color:var(--ink-2) !important;}

  /* markers */
  .mk{
    position:relative; cursor:pointer;
    display:flex; align-items:center; gap:7px;
    padding:6px 11px 6px 8px; border-radius:10px;
    background:var(--surface); border:1.5px solid var(--primary);
    box-shadow:0 4px 14px rgba(16,24,40,.16);
    font-family:'Prompt',sans-serif; white-space:nowrap;
    transition:transform .22s var(--spring), box-shadow .22s var(--ease), background .2s;
    animation:pop .42s var(--spring) both;
  }
  .mk::after{
    content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    border-width:6px 6px 0; border-style:solid;
    border-color:var(--primary) transparent transparent transparent;
  }
  .mk-dot{
    width:9px;height:9px;border-radius:50%;flex-shrink:0;
    background:var(--primary); position:relative;
  }
  .mk-dot::before{
    content:''; position:absolute; inset:-3px; border-radius:50%;
    border:2px solid var(--primary); animation:ring 2.4s ease-out infinite;
  }
  .mk-txt{display:flex; flex-direction:column; line-height:1.15;}
  .mk-name{font-size:11.5px; font-weight:600; color:var(--ink);}
  .mk-cnt{font-size:9.5px; font-weight:500; color:var(--ink-3);}
  .mk:hover{transform:translateY(-3px) scale(1.05); box-shadow:var(--shadow-pop);}
  .mk.on{
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    border-color:var(--primary);
    box-shadow:0 0 0 5px rgba(45,65,153,.18), 0 8px 22px rgba(45,65,153,.4);
  }
  .mk.on .mk-name,.mk.on .mk-cnt{color:#fff;}
  .mk.on .mk-cnt{opacity:.85;}
  .mk.on .mk-dot{background:#fff;}
  .mk.on .mk-dot::before{border-color:#fff;}
  .mk.off{opacity:.55; border-color:var(--border-2); border-style:dashed;}
  .mk.off::after{border-top-color:var(--border-2);}
  .mk.off .mk-dot{background:var(--ink-3);}
  .mk.off .mk-dot::before{display:none;}

  .map-legend{
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    padding-top:11px; font-size:11px; color:var(--ink-3);
  }
  .map-legend span{display:inline-flex; align-items:center; gap:6px;}
  .lg-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);}
  .lg-dot.grey{background:var(--ink-3); opacity:.5;}

  /* ---------- panel ---------- */
  .panel{
    display:flex; flex-direction:column; overflow:hidden;
    min-height:660px;
    animation:rise .55s .12s var(--ease) both;
  }
  .panel-anim{animation:riseSm .34s var(--ease) both;}

  .p-top{padding:20px 20px 0; flex-shrink:0;}
  .p-tools{padding:14px 20px 14px; flex-shrink:0; border-bottom:1px solid var(--border);}
  .p-scroll{flex:1; overflow-y:auto; padding:14px 20px 20px; min-height:0;}
  .p-full{flex:1; overflow-y:auto; padding:20px; min-height:0;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#cdd6e6; border-radius:99px; border:2px solid var(--surface);}
  ::-webkit-scrollbar-thumb:hover{background:#adb9d0;}

  .crumbs{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3); margin-bottom:12px;}
  .crumbs .cb{cursor:pointer; transition:.15s; color:var(--ink-2);}
  .crumbs .cb:hover{color:var(--primary);}
  .crumbs .cb.cur{color:var(--ink); font-weight:600; cursor:default;}
  .crumbs .sp{opacity:.45;}

  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    height:32px; padding:0 13px 0 9px; margin-bottom:14px;
    border-radius:8px; border:1px solid var(--border-2); background:var(--surface);
    font-family:inherit; font-size:12px; font-weight:500; color:var(--ink-2);
    cursor:pointer; transition:.18s var(--ease);
  }
  .back-btn svg{width:14px;height:14px;}
  .back-btn:hover{border-color:var(--primary); color:var(--primary); transform:translateX(-3px); box-shadow:0 4px 12px rgba(45,65,153,.12);}
  .back-btn:active{transform:translateX(0) scale(.97);}

  .p-title{font-size:21px; font-weight:600; margin:0 0 3px; letter-spacing:-.2px; line-height:1.25;}
  .p-sub{font-size:12px; color:var(--ink-2); margin:0 0 14px;}

  /* stat tiles */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:10px; margin-bottom:20px;}
  .tile{
    position:relative; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--r); padding:13px 14px;
    transition:.22s var(--ease);
    animation:riseSm .4s var(--ease) backwards;
  }
  .tile:nth-child(1){animation-delay:.03s} .tile:nth-child(2){animation-delay:.08s}
  .tile:nth-child(3){animation-delay:.13s} .tile:nth-child(4){animation-delay:.18s}
  .tile:hover{background:var(--surface); border-color:var(--primary-2); box-shadow:var(--shadow-2); transform:translateY(-2px);}
  .tile::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,var(--primary),var(--primary-2));
    opacity:0; transition:.22s;
  }
  .tile:hover::before{opacity:1;}
  .tile .t-lbl{font-size:10.5px; color:var(--ink-3); font-weight:500; margin-bottom:4px; letter-spacing:.2px;}
  .tile .t-val{font-size:24px; font-weight:600; line-height:1; letter-spacing:-.5px;}
  .tile .t-val small{font-size:12px; font-weight:500; color:var(--ink-3); margin-left:3px;}

  /* hero */
  .hero{
    text-align:center; padding:8px 0 20px;
    animation:riseSm .45s var(--ease) both;
  }
  .hero .h-num{
    font-size:52px; font-weight:600; line-height:1; letter-spacing:-1.5px;
    background:linear-gradient(135deg,var(--primary) 20%,var(--primary-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero .h-lbl{font-size:12px; color:var(--ink-3); margin-top:6px; letter-spacing:.3px;}

  /* section heading */
  .sec-h{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin:0 0 12px;
  }
  .sec-h h3{margin:0; font-size:12px; font-weight:600; letter-spacing:.45px; text-transform:uppercase; color:var(--ink-3);}
  .sec-h .sh-note{font-size:11px; color:var(--ink-3);}

  /* bar chart (single hue) */
  .bars{display:flex; flex-direction:column; gap:11px; margin-bottom:22px;}
  .bar-row{cursor:default; animation:riseSm .4s var(--ease) backwards;}
  .bar-row.clickable{cursor:pointer; border-radius:8px; padding:5px 7px; margin:-5px -7px; transition:.16s;}
  .bar-row.clickable:hover{background:var(--surface-2);}
  .bar-row.clickable:hover .b-lbl{color:var(--primary);}
  .bar-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:5px;}
  .b-lbl{font-size:12px; color:var(--ink-2); font-weight:500; transition:.16s;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .b-val{font-size:12px; color:var(--ink); font-weight:600; flex-shrink:0; font-variant-numeric:tabular-nums;}
  .b-val em{font-style:normal; font-size:10.5px; color:var(--ink-3); font-weight:500; margin-left:4px;}
  .b-track{height:9px; background:var(--surface-3); border-radius:0 5px 5px 0; overflow:hidden;}
  .b-fill{
    height:100%; border-radius:0 4px 4px 0;
    background:linear-gradient(90deg,var(--primary),var(--primary-2));
    transform-origin:left center;
    animation:grow .7s var(--ease) both;
  }
  .b-fill.zero{background:var(--border-2);}

  /* tools */
  .mini-search{position:relative; margin-bottom:11px;}
  .mini-search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px;height:14px; color:var(--ink-3);}
  .mini-search input{
    width:100%; height:36px; border-radius:9px;
    border:1px solid var(--border-2); background:var(--surface-2);
    padding:0 12px 0 33px; font-family:inherit; font-size:12.5px; color:var(--ink);
    transition:.18s var(--ease);
  }
  .mini-search input:focus{outline:none; background:var(--surface); border-color:var(--primary-2); box-shadow:0 0 0 3px var(--primary-soft);}

  .tool-lbl{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:7px;
  }
  .tool-lbl span:first-child{
    font-size:10.5px; font-weight:600; letter-spacing:.45px;
    text-transform:uppercase; color:var(--ink-3);
  }
  .tool-lbl .link{font-size:11px;}

  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:11px;}
  .chip{
    display:inline-flex; align-items:center; gap:7px;
    height:30px; padding:0 11px 0 8px; border-radius:999px;
    border:1px solid var(--border-2); background:var(--surface);
    font-family:inherit; font-size:11.5px; font-weight:500; color:var(--ink-2);
    cursor:pointer; transition:.18s var(--ease); user-select:none;
  }
  /* the tick box that makes the chip read as a selectable filter */
  .chip .c-box{
    width:15px; height:15px; border-radius:5px; flex-shrink:0;
    border:1.5px solid var(--border-2); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    transition:.18s var(--ease);
  }
  .chip .c-box svg{
    width:9px; height:9px; opacity:0; transform:scale(.4);
    transition:.18s var(--spring); color:var(--primary);
  }
  .chip .c-n{
    font-size:10px; font-weight:600; padding:1px 6px; border-radius:99px;
    background:var(--surface-3); color:var(--ink-3); font-variant-numeric:tabular-nums;
  }
  .chip:hover{border-color:var(--primary-2); color:var(--primary); box-shadow:0 2px 8px rgba(45,65,153,.12);}
  .chip:hover .c-box{border-color:var(--primary-2);}
  .chip.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .chip.on .c-box{background:#fff; border-color:#fff;}
  .chip.on .c-box svg{opacity:1; transform:scale(1);}
  .chip.on .c-n{background:rgba(255,255,255,.22); color:#fff;}
  .chip:active{transform:scale(.95);}
  .chip.dim{opacity:.45;}

  .tool-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .seg{display:inline-flex; background:var(--surface-3); border-radius:8px; padding:3px; gap:2px;}
  .seg button{
    border:none; background:transparent; cursor:pointer;
    font-family:inherit; font-size:11px; font-weight:500; color:var(--ink-2);
    padding:5px 10px; border-radius:6px; transition:.16s;
  }
  .seg button.on{background:var(--surface); color:var(--primary); font-weight:600; box-shadow:0 1px 3px rgba(16,24,40,.1);}
  .seg button:not(.on):hover{color:var(--ink);}
  .tool-row .grow{flex:1;}

  /* people list */
  .plist{display:flex; flex-direction:column; gap:7px;}
  .prow{
    display:flex; align-items:center; gap:11px;
    padding:9px 12px; border-radius:var(--r);
    background:var(--surface-2); border:1px solid var(--border);
    cursor:pointer; transition:.2s var(--ease);
    animation:riseSm .32s var(--ease) backwards;
  }
  .prow:hover{
    background:var(--surface); border-color:var(--primary-2);
    transform:translateY(-2px); box-shadow:var(--shadow-2);
  }
  .prow:active{transform:translateY(0) scale(.995);}
  .av{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    box-shadow:0 3px 9px rgba(45,65,153,.28);
  }
  .pmeta{min-width:0;flex:1;}
  .pname{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ppos{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .pbadge{
    font-size:9.5px;font-weight:600;letter-spacing:.3px;
    padding:3px 8px;border-radius:99px;flex-shrink:0;
    background:var(--primary-soft);color:var(--primary);
  }

  .empty{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:56px 22px;gap:11px;color:var(--ink-3);
  }
  .empty .e-ico{
    width:52px;height:52px;border-radius:16px;
    background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    color:var(--primary-2);animation:floaty 3.4s ease-in-out infinite;
  }
  .empty .e-ico svg{width:24px;height:24px;}
  .empty h4{margin:0;font-size:14px;font-weight:600;color:var(--ink-2);}
  .empty p{margin:0;font-size:12.5px;line-height:1.55;max-width:250px;}
  .link{color:var(--primary);cursor:pointer;font-weight:500;text-decoration:none;border-bottom:1px solid transparent;transition:.15s;}
  .link:hover{border-bottom-color:var(--primary);}

  /* profile */
  .prof{display:flex;flex-direction:column;align-items:center;text-align:center;animation:riseSm .4s var(--ease) both;}
  .prof-av{
    width:92px;height:92px;border-radius:28px;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    box-shadow:0 10px 28px rgba(45,65,153,.34);
    margin-bottom:15px;
    animation:pop .5s var(--spring) both;
  }
  .prof-name{font-size:20px;font-weight:600;margin:0 0 7px;letter-spacing:-.2px;}
  .prof-role{
    font-size:12px;font-weight:600;color:var(--primary);
    background:var(--primary-soft);padding:5px 14px;border-radius:99px;margin-bottom:20px;
  }
  .fields{width:100%;display:flex;flex-direction:column;gap:9px;text-align:left;}
  .field{
    display:flex;align-items:center;gap:11px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--r);padding:11px 13px;
    transition:.2s var(--ease);
    animation:riseSm .34s var(--ease) backwards;
  }
  .field:nth-child(1){animation-delay:.03s}.field:nth-child(2){animation-delay:.07s}
  .field:nth-child(3){animation-delay:.11s}.field:nth-child(4){animation-delay:.15s}
  .field:nth-child(5){animation-delay:.19s}.field:nth-child(6){animation-delay:.23s}
  .field:hover{background:var(--surface);border-color:var(--primary-2);box-shadow:var(--shadow-1);}
  .field .f-ico{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;
  }
  .field .f-ico svg{width:16px;height:16px;}
  .field .f-body{min-width:0;flex:1;}
  .f-lbl{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;font-weight:500;display:block;}
  .f-val{font-size:13px;color:var(--ink);font-weight:500;word-break:break-word;line-height:1.4;}
  .copy-btn{
    width:28px;height:28px;border-radius:8px;flex-shrink:0;
    border:1px solid var(--border-2);background:var(--surface);
    color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:.16s;
  }
  .copy-btn svg{width:13px;height:13px;}
  .copy-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
  .copy-btn.done{background:var(--ok);border-color:var(--ok);color:#fff;}

  /* toast */
  #toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;
    padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.28);
    opacity:0;pointer-events:none;transition:.28s var(--ease);z-index:2000;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* tooltip for bars */
  #bartip{
    position:fixed;pointer-events:none;z-index:1500;
    background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;
    padding:6px 10px;border-radius:7px;white-space:nowrap;
    opacity:0;transition:opacity .14s;box-shadow:0 6px 18px rgba(0,0,0,.24);
  }
  #bartip.show{opacity:1;}

  .divider{height:1px;background:var(--border);margin:4px 0 18px;}
</style>
</head>

  copy:'<svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2.2" stroke="currentColor" stroke-width="1.9"/><path d="M15 6.2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17.5 19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none"><path d="M15 18.5 8.5 12 15 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.8v11m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 17v1.7A2.3 2.3 0 0 0 6.8 21h10.4a2.3 2.3 0 0 0 2.3-2.3V17" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.8"/></svg>',
};

/* ========================= MAP ========================= */
const map = L.map('leaflet-map', { zoomControl:false, minZoom:6, scrollWheelZoom:true }).setView([13.62,101.06], 8);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  { maxZoom:18, attribution:'&copy; OpenStreetMap &copy; CartoDB' }).addTo(map);

const HOME_VIEW = { center:[13.62,101.06], zoom:8 };
const markers = {};

function markerHtml(loc, n, active, delay){
  const cls = 'mk' + (active?' on':'') + (n===0?' off':'');
  const d = delay!=null ? ` style="animation-delay:${delay}s"` : '';
  return `<div class="${cls}"${d}><span class="mk-dot"></span><span class="mk-txt">`
       + `<span class="mk-name">${esc(loc.label)}</span>`
       + `<span class="mk-cnt">${n} staff</span></span></div>`;
}
function makeIcon(loc, active, delay){
  return L.divIcon({ className:'mk-wrap', html:markerHtml(loc, staffOf(loc).length, active, delay),
                     iconSize:[null,null], iconAnchor:[52,44] });
}
LOCATIONS.forEach((loc,i)=>{
  const m = L.marker([loc.lat,loc.lng], { icon:makeIcon(loc,false,i*0.05) }).addTo(map);
  m.on('click', ()=>selectLoc(loc.id));
  markers[loc.id] = m;
});
function refreshMarkers(){
  LOCATIONS.forEach(loc=>{
    const n = staffOf(loc).length, m = markers[loc.id];
    if(n===0 && !showEmpty){ if(map.hasLayer(m)) map.removeLayer(m); return; }
    if(!map.hasLayer(m)) m.addTo(map);
    m.setIcon(makeIcon(loc, curLoc===loc.id));
  });
}

/* ========================= HELPERS ========================= */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700);
}
function countUp(el,target,ms){
  const t0=performance.now(); const from=0;
  (function step(now){
    const k=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-k,3);
    el.textContent = Math.round(from+(target-from)*e).toLocaleString();
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
function animatePanel(){
  panel.classList.remove('panel-anim'); void panel.offsetWidth; panel.classList.add('panel-anim');
}
function crumbs(){
  const p=[`<span class="cb ${!curLoc?'cur':''}" onclick="goHome()">Overview</span>`];
  if(curLoc){ const g=findGroup(curLoc);
    p.push('<span class="sp">/</span>',`<span class="cb ${!curPerson?'cur':''}" onclick="selectLoc('${curLoc}')">${esc(g.name)}</span>`); }
  if(curPerson) p.push('<span class="sp">/</span>','<span class="cb cur">Profile</span>');
  return `<div class="crumbs">${p.join('')}</div>`;
}
function barRow(label, val, max, opts){
  opts = opts || {};
  const pct = max>0 ? (val/max*100) : 0;
  const share = opts.total ? ` <em>${Math.round(val/opts.total*100)}%</em>` : '';
  const click = opts.onclick ? ` onclick="${opts.onclick}"` : '';
  return `<div class="bar-row ${opts.onclick?'clickable':''}"${click} data-tip="${esc(label)}: ${val} staff"
            style="animation-delay:${(opts.i||0)*0.05}s">
    <div class="bar-head"><span class="b-lbl">${esc(label)}</span><span class="b-val">${val}${share}</span></div>
    <div class="b-track"><div class="b-fill ${val===0?'zero':''}" style="width:${Math.max(pct,val>0?2:1.5)}%;animation-delay:${(opts.i||0)*0.05}s"></div></div>
  </div>`;
}

/* ========================= VIEWS ========================= */
function render(){
  if(query.trim()) renderSearch();
  else if(curPerson) renderProfile();
  else if(curLoc) renderLoc();
  else renderOverview();
  animatePanel();
}

function renderOverview(){
  const total = PEOPLE.length;
  // positions stay in ROLES order = seniority (Senior Eng → PE → Site Eng → Sup → FM → Others)
  const byRole = ROLES.map(r=>({r, n:PEOPLE.filter(p=>p.role===r.id).length}));
  const byLoc = GROUPS.map(g=>({g, n:staffOf(g).length})).sort((a,b)=>b.n-a.n);
  const maxRole = Math.max(...byRole.map(x=>x.n));
  const maxLoc  = Math.max(...byLoc.map(x=>x.n));
  const activeSites = new Set(PEOPLE.map(p=>p.site).filter(s=>s!=='OTHER')).size;
  const activeLocs  = byLoc.filter(x=>x.n>0 && x.g.id!=='other').length;

  panel.innerHTML = `
    <div class="p-full">
      ${crumbs()}
      <div class="hero">
        <div class="h-num" id="hero-n">0</div>
        <div class="h-lbl">Engineering &amp; site staff on record</div>
      </div>
      <div class="tiles">
        <div class="tile"><div class="t-lbl">Locations</div><div class="t-val">${activeLocs}<small>/ ${LOCATIONS.length}</small></div></div>
        <div class="tile"><div class="t-lbl">Active jobs</div><div class="t-val">${activeSites}</div></div>
        <div class="tile"><div class="t-lbl">Positions</div><div class="t-val">${ROLES.length}</div></div>
        <div class="tile"><div class="t-lbl">Other / HQ</div><div class="t-val">${staffOf(OTHER_GROUP).length}</div></div>
      </div>

      <div class="sec-h"><h3>Staff by position</h3><span class="sh-note">${total} total</span></div>
      <div class="bars">
        ${byRole.map((x,i)=>barRow(x.r.label+' ('+x.r.abbr+')', x.n, maxRole, {total, i})).join('')}
      </div>

      <div class="sec-h"><h3>Staff by location</h3><span class="sh-note">click to open</span></div>
      <div class="bars">
        ${byLoc.map((x,i)=>barRow(x.g.name, x.n, maxLoc, {total, i, onclick:`selectLoc('${x.g.id}')`})).join('')}
      </div>
    </div>`;
  countUp(document.getElementById('hero-n'), total, 900);
  bindTips();
}

function locPeople(){
  const g = findGroup(curLoc);
  let list = staffOf(g).filter(p=>activeRoles.has(p.role));
  const q = listQuery.trim().toLowerCase();
  if(q) list = list.filter(p =>
    p.name.toLowerCase().includes(q) || p.empNo.toLowerCase().includes(q) ||
    p.positionThai.toLowerCase().includes(q) || p.site.toLowerCase().includes(q) ||
    (p.groupDetail||'').toLowerCase().includes(q));
  const order = { se_senior:0, pe:1, se_site:2, sup:3, fm:4, other:5 };
  if(sortBy==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'th'));
  else if(sortBy==='role') list.sort((a,b)=>(order[a.role]-order[b.role])||a.name.localeCompare(b.name,'th'));
  else list.sort((a,b)=>a.empNo.localeCompare(b.empNo));
  return list;
}

function renderLoc(){
  const g = findGroup(curLoc);
  const all = staffOf(g);
  const list = locPeople();
  const isOther = g.id==='other';

  panel.innerHTML = `
    <div class="p-top">
      ${crumbs()}
      <button class="back-btn" onclick="goHome()">${I.back} Overview</button>
      <div class="p-title">${esc(g.name)}</div>
      <div class="p-sub">${all.length} staff${isOther?' · not tied to a mapped site':''}</div>
    </div>
    <div class="p-tools">
      <div class="mini-search">
        ${I.search}
        <input id="lsearch" type="text" placeholder="Filter within ${esc(g.label||g.name)}…" value="${esc(listQuery)}">
      </div>
      <div class="tool-lbl">
        <span>Filter by position — tap to toggle</span>
        ${activeRoles.size!==ROLES.length?`<span class="link" onclick="resetRoles()">Select all</span>`:''}
      </div>
      <div class="chips">
        ${ROLES.map(r=>{
          const n = all.filter(p=>p.role===r.id).length;
          const on = activeRoles.has(r.id);
          return `<span class="chip ${on?'on':''} ${n===0?'dim':''}" onclick="toggleRole('${r.id}')"
                        role="checkbox" aria-checked="${on}" title="${on?'Click to hide':'Click to show'} ${esc(r.label)}">
                    <span class="c-box">${I.check}</span>${esc(r.label)} <span class="c-n">${n}</span></span>`;
        }).join('')}
      </div>
      <div class="tool-row">
        <div class="seg">
          <button class="${sortBy==='role'?'on':''}" onclick="setSort('role')">Position</button>
          <button class="${sortBy==='name'?'on':''}" onclick="setSort('name')">Name</button>
          <button class="${sortBy==='id'?'on':''}" onclick="setSort('id')">ID</button>
        </div>
        <span class="grow"></span>
        <button class="chip-btn" onclick="exportCsv()">${I.dl} CSV</button>
      </div>
    </div>
    <div class="p-scroll">
      <div class="sec-h"><h3>${list.length} shown</h3>${list.length!==all.length?`<span class="sh-note">of ${all.length}</span>`:''}</div>
      ${list.length ? `<div class="plist">${list.map((p,i)=>personRow(p,i)).join('')}</div>`
        : emptyListHtml()}
    </div>`;

  const inp = document.getElementById('lsearch');
  inp.addEventListener('input', e=>{ listQuery=e.target.value; refreshList(); });
}

function refreshList(){
  const g = findGroup(curLoc), all = staffOf(g), list = locPeople();
  const sc = panel.querySelector('.p-scroll');
  sc.innerHTML = `<div class="sec-h"><h3>${list.length} shown</h3>${list.length!==all.length?`<span class="sh-note">of ${all.length}</span>`:''}</div>`
    + (list.length ? `<div class="plist">${list.map((p,i)=>personRow(p,i)).join('')}</div>`
      : emptyListHtml());
}

function emptyListHtml(){
  if(!activeRoles.size) return `<div class="empty"><div class="e-ico">${I.search}</div>
      <h4>No position selected</h4>
      <p>Tick at least one position above, or <span class="link" onclick="resetRoles()">select all</span>.</p></div>`;
  return `<div class="empty"><div class="e-ico">${I.search}</div><h4>No matches</h4>
      <p>Try a different name or ID, or tick another position above.</p></div>`;
}

function personRow(p, i){
  return `<div class="prow" onclick="selectPerson('${p.id}')" style="animation-delay:${Math.min(i,14)*0.028}s">
    <div class="av">${esc(initials(p.name))}</div>
    <div class="pmeta">
      <div class="pname">${esc(p.name)}</div>
      <div class="ppos">${esc(p.positionThai)}${p.groupDetail && p.groupDetail!=='-' ? ' · '+esc(p.groupDetail) : ''}</div>
    </div>
    <span class="pbadge" title="${esc(ROLE_MAP[p.role].label)}">${esc(ROLE_MAP[p.role].abbr)}</span>
  </div>`;
}

function renderSearch(){
  const q = query.trim().toLowerCase();
  const hits = PEOPLE.filter(p =>
    p.name.toLowerCase().includes(q) || p.empNo.toLowerCase().includes(q) ||
    p.positionThai.toLowerCase().includes(q) || p.site.toLowerCase().includes(q) ||
    (p.groupDetail||'').toLowerCase().includes(q) ||
    ROLE_MAP[p.role].label.toLowerCase().includes(q)
  ).slice(0,80);

  panel.innerHTML = `
    <div class="p-top">
      <div class="crumbs"><span class="cb" onclick="clearSearch()">Overview</span><span class="sp">/</span><span class="cb cur">Search</span></div>
      <button class="back-btn" onclick="clearSearch()">${I.back} Clear search</button>
      <div class="p-title">“${esc(query.trim())}”</div>
      <div class="p-sub">${hits.length}${hits.length===80?'+':''} match${hits.length===1?'':'es'} across all locations</div>
    </div>
    <div class="p-scroll">
      ${hits.length ? `<div class="plist">${hits.map((p,i)=>{
        const g = findGroup(SITE_TO_LOC[p.site]);
        return `<div class="prow" onclick="selectPerson('${p.id}')" style="animation-delay:${Math.min(i,14)*0.028}s">
          <div class="av">${esc(initials(p.name))}</div>
          <div class="pmeta">
            <div class="pname">${esc(p.name)}</div>
            <div class="ppos">${esc(p.empNo)} · ${esc(g?g.label||g.name:'—')} · ${esc(p.site)}</div>
          </div>
          <span class="pbadge" title="${esc(ROLE_MAP[p.role].label)}">${esc(ROLE_MAP[p.role].abbr)}</span>
        </div>`;}).join('')}</div>`
      : `<div class="empty"><div class="e-ico">${I.search}</div><h4>Nothing found</h4>
           <p>No staff match “${esc(query.trim())}”. Try part of a name, an employee ID like P02500, or a job code like GCE.</p></div>`}
    </div>`;
}

function renderProfile(){
  const p = PEOPLE.find(x=>x.id===curPerson);
  const locId = SITE_TO_LOC[p.site], g = locId?findGroup(locId):null;
  const role = ROLE_MAP[p.role];
  const f = (ico,lbl,val,copy) => `<div class="field">
      <div class="f-ico">${ico}</div>
      <div class="f-body"><span class="f-lbl">${lbl}</span><span class="f-val">${esc(val)}</span></div>
      ${copy?`<button class="copy-btn" onclick="copyVal(this,'${esc(val)}')" title="Copy">${I.copy}</button>`:''}
    </div>`;

  panel.innerHTML = `
    <div class="p-full">
      ${crumbs()}
      <button class="back-btn" onclick="selectLoc('${locId}')">${I.back} ${esc(g?g.name:'Back')}</button>
      <div class="prof">
        <div class="prof-av">${esc(initials(p.name))}</div>
        <div class="prof-name">${esc(p.name)}</div>
        <div class="prof-role">${esc(role.label)} (${esc(role.abbr)})</div>
        <div class="fields">
          ${f(I.id,'Employee No', p.empNo, true)}
          ${f(I.id,'Position (Thai)', p.positionThai)}
          ${f(I.tag,'Productivity Position', p.prodPosition)}
          ${f(I.brief,'Group Detail of Work', p.groupDetail)}
          ${g?f(I.map,'Workplace', g.name):''}
          ${f(I.tag,'Job Alias', p.jobAlias)}
        </div>
      </div>
    </div>`;
}

/* ========================= ACTIONS ========================= */
function goHome(){ curLoc=null; curPerson=null; query=''; syncSearchUi(); refreshMarkers(); render(); }
function resetListState(){
  listQuery=''; sortBy='role'; activeRoles = new Set(ROLES.map(r=>r.id));
}
// Only wipe the filters/search/sort when we're actually moving to a DIFFERENT
// location. Coming back from a profile (or re-clicking the same pin) keeps
// whatever the user had set up.
function selectLoc(id){
  if(id !== curLoc) resetListState();
  curLoc=id; curPerson=null; query='';
  syncSearchUi();
  const l = LOCATIONS.find(x=>x.id===id);
  if(l) map.flyTo([l.lat,l.lng], Math.max(map.getZoom(),9), {duration:.7});
  refreshMarkers(); render();
}
function selectPerson(id){
  const p=PEOPLE.find(x=>x.id===id);
  if(p){
    const loc = SITE_TO_LOC[p.site];
    // opened from global search / another context — start that location clean
    if(loc !== curLoc){ resetListState(); curLoc = loc; }
  }
  curPerson=id;
  query=''; syncSearchUi(); refreshMarkers(); render();
}
function toggleRole(id){
  activeRoles.has(id)?activeRoles.delete(id):activeRoles.add(id);
  renderLoc(); animatePanel();
}
function resetRoles(){ activeRoles=new Set(ROLES.map(r=>r.id)); renderLoc(); animatePanel(); }
function setSort(s){ sortBy=s; renderLoc(); animatePanel(); }
function clearSearch(){ query=''; syncSearchUi(); render(); }
function copyVal(btn,val){
  const done=()=>{ btn.classList.add('done'); btn.innerHTML=I.check; toast('Copied '+val);
                   setTimeout(()=>{btn.classList.remove('done'); btn.innerHTML=I.copy;},1400); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(val).then(done).catch(fallback); }
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=val; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy not supported'); }
    document.body.removeChild(ta);
  }
}
function exportCsv(){
  const g=findGroup(curLoc), rows=locPeople();
  const head=['Emp No','Display Name','Position Thai','Productivity Position','Group Detail of Work','Job Alias','Site','Workplace'];
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv='﻿'+[head.map(q).join(',')].concat(
    rows.map(p=>[p.empNo,p.name,p.positionThai,p.prodPosition,p.groupDetail,p.jobAlias,p.site,g.name].map(q).join(','))
  ).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');
  a.href=url; a.download=`STECON_${g.id}_staff.csv`; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast(`Exported ${rows.length} rows`);
}
window.goHome=goHome; window.selectLoc=selectLoc; window.selectPerson=selectPerson;
window.toggleRole=toggleRole; window.resetRoles=resetRoles; window.setSort=setSort; window.clearSearch=clearSearch;
window.copyVal=copyVal; window.exportCsv=exportCsv;

/* ========================= SEARCH UI ========================= */
const gs=document.getElementById('gsearch'), sbox=document.getElementById('searchbox');
function syncSearchUi(){ gs.value=query; sbox.classList.toggle('has-val', !!query); }
gs.addEventListener('input', e=>{ query=e.target.value; sbox.classList.toggle('has-val', !!query); render(); });
document.getElementById('gclear').addEventListener('click', ()=>{ clearSearch(); gs.focus(); });
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==gs && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); gs.focus(); gs.select();
  } else if(e.key==='Escape'){
    if(query){ clearSearch(); gs.blur(); }
    else if(curPerson){ selectLoc(SITE_TO_LOC[PEOPLE.find(x=>x.id===curPerson).site]); }
    else if(curLoc){ goHome(); }
  }
});

/* ========================= BAR TOOLTIPS ========================= */
const tip=document.getElementById('bartip');
function bindTips(){
  panel.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mouseenter', ()=>{ tip.textContent=el.dataset.tip; tip.classList.add('show'); });
    el.addEventListener('mousemove', ev=>{
      tip.style.left=Math.min(ev.clientX+14, window.innerWidth-tip.offsetWidth-10)+'px';
      tip.style.top=(ev.clientY-34)+'px';
    });
    el.addEventListener('mouseleave', ()=>tip.classList.remove('show'));
  });
}

/* ========================= MAP CONTROLS ========================= */
document.getElementById('btn-reset').addEventListener('click', ()=>{
  map.flyTo(HOME_VIEW.center, HOME_VIEW.zoom, {duration:.7});
});
const btnEmpty=document.getElementById('btn-empty'), btnEmptyTxt=document.getElementById('btn-empty-txt');
btnEmpty.addEventListener('click', ()=>{
  showEmpty=!showEmpty;
  btnEmpty.classList.toggle('on', !showEmpty);
  btnEmptyTxt.textContent = showEmpty ? 'Hide empty' : 'Show empty';
  refreshMarkers();
});

/* ========================= INIT ========================= */
countUp(document.getElementById('hs-total'), PEOPLE.length, 1100);
refreshMarkers();
render();
</script>
</body>
</html>
